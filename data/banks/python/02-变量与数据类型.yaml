meta:
  id: py-02
  title: 变量与数据类型
  source: 相关知识/Python/02-变量与数据类型.md
  order: 2
questions:
  - qid: py-02-001
    type: single
    stem: "执行 `a = [1, 2]; b = a; a.append(3)` 之后，b 的值是？"
    options:
      - text: "[1, 2]"
      - text: "[1, 2, 3]"
      - text: 报错
      - text: "[3]"
    answer: [1]
    explain: "赋值不是复制，而是把名字绑定到同一个对象上。a 和 b 指向同一个列表，通过其中一个做的原地修改在另一个上也可见。"
    tags: [引用, 易错]
    difficulty: 2

  - qid: py-02-002
    type: multiple
    stem: "以下哪些是 Python 的不可变类型？"
    options:
      - text: "int"
      - text: "str"
      - text: "tuple"
      - text: "list"
      - text: "frozenset"
      - text: "dict"
    answer: [0, 1, 2, 4]
    explain: "不可变：int、float、bool、str、tuple、frozenset、bytes。可变：list、dict、set、bytearray。注意 tuple 只是自身不可变，里面的列表仍然可以改。"
    tags: [可变性]
    difficulty: 2

  - qid: py-02-003
    type: single
    stem: "表达式 `0.1 + 0.2 == 0.3` 的结果是？"
    options:
      - text: "True"
      - text: "False"
      - text: 有时 True 有时 False
      - text: 报错
    answer: [1]
    explain: "二进制浮点无法精确表示 0.1，实际结果约为 0.30000000000000004。比较用 math.isclose(a, b)，金额计算用 Decimal 或按最小单位用整数。"
    tags: [浮点数, 易错]
    difficulty: 2

  - qid: py-02-004
    type: code
    stem: "用 Decimal 精确计算 0.1 + 0.2。注意初始化方式。"
    template: |
      from decimal import Decimal
      result = Decimal({{blank}}) + Decimal({{blank}})
    blanks: ["'0.1'", "'0.2'"]
    explain: "必须用字符串构造 Decimal。写成 Decimal(0.1) 会把浮点本身的误差一起带进去，得到 0.1000000000000000055511151231257827。"
    tags: [浮点数, 易错]
    difficulty: 3

  - qid: py-02-005
    type: single
    stem: "关于 `is`，下面哪个表达式的结果通常是 False？"
    options:
      - text: "a = 256; b = 256; a is b"
      - text: 在交互式环境分两行写 a = 257 和 b = 257，再算 a is b
      - text: "a = None; a is None"
      - text: "a = 'hello'; b = 'hello'; a is b"
    answer: [1]
    explain: "CPython 缓存 -5 到 256 的小整数，超出范围的字面量在交互式逐行执行时通常是不同对象；写在同一个 .py 文件或同一行里会被常量折叠优化。这些是实现细节，判断值相等一律用 ==，只有和 None 比较才用 is。"
    tags: [is, 易错]
    difficulty: 3

  - qid: py-02-006
    type: code
    stem: "一行代码交换两个变量的值，不用中间变量。"
    template: |
      a, b = {{blank}}
    blanks: ["b, a"]
    explain: "右侧会先打包成元组，再依次解包绑定到左侧，所以不需要临时变量。"
    tags: [解包]
    difficulty: 1

  - qid: py-02-007
    type: single
    stem: "判断变量 x 是否为 None，推荐的写法是？"
    options:
      - text: "x == None"
      - text: "x is None"
      - text: "not x"
      - text: "x != 0"
    answer: [1]
    explain: "== 会调用 __eq__，可能被自定义对象改写；not x 会把 0、空字符串、空容器也当成「空」，语义不符。is 比较身份，与单例 None 比较最准确。"
    tags: [None, 易错]
    difficulty: 2

  - qid: py-02-008
    type: code
    stem: "判断 x 是 int（含子类）实例，但要把 bool 排除掉。"
    template: |
      isinstance(x, {{blank}}) and not isinstance(x, {{blank}})
    blanks: [int, bool]
    explain: "bool 是 int 的子类，isinstance(True, int) 为 True。type(x) is int 只认精确类型，不做子类判断。"
    tags: [类型判断, 易错]
    difficulty: 3

  - qid: py-02-009
    type: single
    stem: "「Python 是动态类型语言」指的是？"
    options:
      - text: 变量本身没有类型约束，同一个名字可以重新绑定到任意类型的对象
      - text: 声明变量时必须写清类型
      - text: 运行时完全不做类型检查
      - text: 不同类型之间会自动转换
    answer: [0]
    explain: "类型属于对象而不属于变量，变量只是名字。运行时仍会做类型检查，不兼容的操作会抛 TypeError。"
    tags: [类型系统]
    difficulty: 2

  - qid: py-02-010
    type: code
    stem: "用带星号的解包，把首尾元素单独取出、中间部分收成列表。"
    template: |
      first, *middle, last = {{blank}}
    blanks: ["[1, 2, 3, 4, 5]"]
    explain: "带星号的目标会把剩余元素收集成列表，整个结构中最多只能有一个星号。first 得到 1，middle 得到 [2, 3, 4]，last 得到 5。"
    tags: [解包]
    difficulty: 2

  - qid: py-02-011
    type: single
    stem: "在 Python 中，`True + True` 和 `sum([True, False, True])` 的结果分别是？"
    options:
      - text: "2 和 2"
      - text: "True 和 True"
      - text: "报错"
      - text: "1 和 1"
    answer: [0]
    explain: "bool 是 int 的子类，True 等价于 1、False 等价于 0。因此 True+True==2，sum([True,False,True])==2。这正是『统计满足条件的个数』常用 `sum(x > 0 for x in lst)` 的原理。"
    tags: [bool, 易错]
    difficulty: 2

  - qid: py-02-012
    type: single
    stem: "下面这个函数连续调用会发生什么？\n```python\ndef add(item, target=[]):\n    target.append(item)\n    return target\n```\n依次执行 `add('A')`、`add('B')`？"
    options:
      - text: "分别返回 ['A'] 和 ['B']"
      - text: "分别返回 ['A'] 和 ['A', 'B']"
      - text: "两次都返回 ['A', 'B']"
      - text: "报错"
    answer: [1]
    explain: "默认参数只在函数定义时求值一次，之后所有调用共享同一个列表对象。所以第二次调用会带上第一次追加的 'A'。铁律：默认参数只用不可变对象（None/数字/字符串/元组），需要可变默认值用 None 做哨兵、在函数体内创建。"
    tags: [函数, 易错]
    difficulty: 3

  - qid: py-02-013
    type: single
    stem: "`int(3.99)` 和 `int(-3.99)` 的结果分别是？"
    options:
      - text: "3 和 -3"
      - text: "4 和 -4"
      - text: "3 和 -4"
      - text: "4 和 -3"
    answer: [0]
    explain: "int() 对 float 是向零截断（不是四舍五入）：int(3.99)==3，int(-3.99)==-3。想四舍五入用 round()，向下取整用 math.floor()，向上取整用 math.ceil()。"
    tags: [类型转换, 易错]
    difficulty: 2

  - qid: py-02-014
    type: single
    stem: "表达式 `None == 0`、`None == []`、`None == False` 的结果分别是？"
    options:
      - text: "全部为 False"
      - text: "全部为 True"
      - text: "True、False、True"
      - text: "只有 None == False 为 True"
    answer: [0]
    explain: "None 是 NoneType 的唯一实例，不等于 0、空字符串、空列表、False。判断空值必须用 `is None`。注意 None == x 在语法上允许（PEP 8 仍建议用 is），但 `is` 不会被 __eq__ 重载欺骗。"
    tags: [None, 易错]
    difficulty: 2

  - qid: py-02-015
    type: single
    stem: "函数 `def f(n=None):\n    if not n:\n        n = 10\n    return n`，调用 `f(0)` 返回？"
    options:
      - text: "0"
      - text: "10"
      - text: "None"
      - text: "报错"
    answer: [1]
    explain: "`not n` 在 n=0 时也为真（0 是 falsy），于是把 0 当成了『没传参』而覆盖了。当 0、空串、空列表是合法输入时，必须用 `if n is None` 判断，不能用 `if not n`。"
    tags: [真值测试, 易错]
    difficulty: 3

  - qid: py-02-016
    type: single
    stem: "`t = (1, 2, [3, 4])` 之后执行 `t[2].append(5)`，结果如何？"
    options:
      - text: "合法，t 变成 (1, 2, [3, 4, 5])"
      - text: "报错，因为元组不可变"
      - text: "t 仍是 (1, 2, [3, 4])"
      - text: "t 变成 (1, 2, 5)"
    answer: [0]
    explain: "元组的不可变是指『它保存的引用不能变』，但被引用的列表对象自身能否修改元组管不着。`t[2].append(5)` 改的是列表，合法。这也是为什么装了可变对象的元组不能做字典的键（unhashable）。"
    tags: [可变性, 易错]
    difficulty: 3

  - qid: py-02-017
    type: single
    stem: "执行 `board = [['-'] * 3] * 3` 后，`board[0][0] = 'X'`，board 会变成？"
    options:
      - text: "[['X','-','-'], ['X','-','-'], ['X','-','-']]"
      - text: "[['X','-','-'], ['-','-','-'], ['-','-','-']]"
      - text: "报错"
      - text: "[['X','-','-']] * 3"
    answer: [0]
    explain: "外层 `* 3` 只是把同一个内层列表的引用复制了 3 份，三行共享同一列表对象，改一行全变。正确写法是 `[['-']*3 for _ in range(3)]`（每次循环新建列表）。注意 `'-'*3` 本身没问题（字符串不可变，共享无所谓）。"
    tags: [可变对象, 易错]
    difficulty: 3

  - qid: py-02-018
    type: single
    stem: "用 `copy.copy` 浅拷贝 `original = [1, 2, [3, 4]]` 得 `shallow`，再执行 `shallow[2].append(5)`，`original` 会怎样？"
    options:
      - text: "original 变成 [1, 2, [3, 4, 5]]"
      - text: "original 不变，仍是 [1, 2, [3, 4]]"
      - text: "original 变成 [1, 2, [3, 4], 5]"
      - text: "报错"
    answer: [0]
    explain: "浅拷贝只复制最外层，嵌套的可变对象（内层列表）仍是共享的。改嵌套层会同时影响原对象。要完全独立需 `copy.deepcopy`（递归拷贝所有层）。"
    tags: [拷贝, 易错]
    difficulty: 3

  - qid: py-02-019
    type: single
    stem: "函数 `def f(items):\n    items = [9]`，调用 `data = [1]; f(data); print(data)`，输出是？"
    options:
      - text: "[1]"
      - text: "[9]"
      - text: "[]"
      - text: "报错"
    answer: [0]
    explain: "Python 传参是『传对象引用』（call by object reference）。给形参重新赋值（items = [9]）只是把形参这张便利贴撕下贴别处，不影响外部实参 data。只有原地修改（如 items.append）才会影响外部。"
    tags: [函数, 传参, 易错]
    difficulty: 3

  - qid: py-02-020
    type: single
    stem: "`round(0.5)` 和 `round(2.5)` 的结果分别是？"
    options:
      - text: "0 和 2"
      - text: "1 和 3"
      - text: "1 和 2"
      - text: "0 和 3"
    answer: [0]
    explain: "Python 的 round 用银行家舍入（四舍六入五成双）：恰好 .5 时舍入到最近的偶数。round(0.5)==0，round(2.5)==2。Java 的 Math.round(2.5)==3 是普通四舍五入。要传统四舍五入用 Decimal(ROUND_HALF_UP)。"
    tags: [浮点数, 易错]
    difficulty: 3

  - qid: py-02-021
    type: single
    stem: "在 Python 中计算 `2 ** 100`，结果会怎样？"
    options:
      - text: "得到精确的大整数，不会溢出"
      - text: "溢出变成负小数"
      - text: "等于 16（对位宽取模，像 Java 的 1<<100）"
      - text: "报错"
    answer: [0]
    explain: "Python 的 int 是任意精度，只受内存限制，2**100 精确可算。Java 的 int/long 固定位宽会静默溢出，大数要走 BigInteger。注意大整数运算比固定位宽慢。"
    tags: [int, 数值]
    difficulty: 2

  - qid: py-02-022
    type: single
    stem: "`list('abc')` 和 `list({'x': 1, 'y': 2})` 的结果分别是？"
    options:
      - text: "['a', 'b', 'c'] 和 ['x', 'y']"
      - text: "['abc'] 和 [1, 2]"
      - text: "['a', 'b', 'c'] 和 [1, 2]"
      - text: "'abc' 和 {'x', 'y'}"
    answer: [0]
    explain: "list 对字符串按字符拆成 ['a','b','c']；对字典默认遍历键，得到 ['x','y']（要值用 .values()，要键值对用 .items()）。"
    tags: [类型转换]
    difficulty: 2
