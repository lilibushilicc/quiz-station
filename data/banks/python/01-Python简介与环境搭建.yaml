meta:
  id: py-01
  title: Python 简介与环境搭建
  source: 相关知识/Python/01-Python简介与环境搭建.md
  order: 1
questions:
  - qid: py-01-001
    type: single
    stem: "`python app.py` 执行时，CPython 内部的处理顺序是？"
    options:
      - text: 直接把源码交给 CPU 逐行执行
      - text: 先编译成字节码，再由 Python 虚拟机解释执行
      - text: 先编译成机器码，再由 CPU 直接执行
      - text: 先转成 Java 字节码，再交给 JVM 执行
    answer: [1]
    explain: "CPython 会先把 .py 编译成平台无关的字节码，缓存到 __pycache__/*.pyc，再由 PVM 逐条解释执行。所以 Python 属于「先编译、后解释」，不是纯解释型。"
    tags: [运行机制]
    difficulty: 2

  - qid: py-01-002
    type: boolean
    stem: "删掉 __pycache__ 目录里的 .pyc 文件后，程序就跑不起来了。"
    answer: [1]
    explain: "__pycache__ 只是编译缓存，删掉后下次运行会重新生成，只是启动稍慢。发布时通常会把它加入 .gitignore。"
    tags: [运行机制]
    difficulty: 1

  - qid: py-01-003
    type: single
    stem: "Windows 上用 py 启动器指定 3.11 版本运行脚本，正确的命令是？"
    options:
      - text: "py -3.11 app.py"
      - text: "python311 app.py"
      - text: "py --version 3.11 app.py"
      - text: "python -3.11 app.py"
    answer: [0]
    explain: "py 启动器是 Windows 专属的版本选择工具，`py -3.11` 指定版本，`py -0` 列出已安装的全部版本。"
    tags: [环境]
    difficulty: 1

  - qid: py-01-004
    type: code
    stem: "让 print 用短横线分隔、并且结尾不换行。"
    template: |
      print("a", "b", "c", sep={{blank}}, end={{blank}})
    blanks: ["'-'", "''"]
    explain: "sep 控制多个参数之间的分隔符，默认是空格；end 控制结尾字符，默认是换行符。两者设为对应值即可一行输出 a-b-c。"
    tags: [print]
    difficulty: 1

  - qid: py-01-005
    type: multiple
    stem: "符合 PEP 8 代码风格的做法有哪些？"
    options:
      - text: 每层缩进用 4 个空格
      - text: 用 Tab 缩进，一个 Tab 顶 4 个空格
      - text: 代码行长度建议不超过 79 个字符
      - text: 类名用大驼峰，函数和变量用小写加下划线
    answer: [0, 2, 3]
    explain: "PEP 8 建议 4 空格缩进、行宽 79（注释和文档字符串 72）、类名大驼峰、其余小写下划线。Tab 与空格不可混用。"
    tags: [PEP 8]
    difficulty: 2

  - qid: py-01-006
    type: single
    stem: "同一代码块里混用 Tab 和空格缩进，会抛出什么？"
    options:
      - text: "IndentationError"
      - text: "TabError"
      - text: "SyntaxError"
      - text: 不会报错，正常执行
    answer: [1]
    explain: "混用会抛 TabError，它是 IndentationError 的子类，而 IndentationError 又是 SyntaxError 的子类。Python 3 不再猜测 Tab 宽度，统一用 4 个空格最稳妥。"
    tags: [缩进, 易错]
    difficulty: 2

  - qid: py-01-007
    type: code
    stem: "input() 拿到的永远是字符串，做数值比较前需要转换。"
    template: |
      age = {{blank}}(input("请输入年龄: "))
      print(age > 18)
    blanks: [int]
    explain: "input() 返回 str，直接和整数比较会抛 TypeError。需要做显式类型转换，生产代码还应处理输入非法的情况。"
    tags: [input, 易错]
    difficulty: 1

  - qid: py-01-008
    type: multiple
    stem: "关于 Python 的各种实现，说法正确的是？"
    options:
      - text: CPython 用 C 写成，是最常用的参考实现
      - text: PyPy 带 JIT 编译，很多场景比 CPython 快
      - text: Jython 运行在 JVM 上，可以调用 Java 类库
      - text: Python 语言只有 CPython 一种实现
    answer: [0, 1, 2]
    explain: "除 CPython 外还有 PyPy（JIT）、Jython（JVM）、IronPython（.NET）等实现。平时说的「Python」默认指 CPython。"
    tags: [生态]
    difficulty: 2

  - qid: py-01-009
    type: single
    stem: "Python 里写多行说明文字（docstring）通常用？"
    options:
      - text: "/* 说明 */"
      - text: 三个连续引号包裹的字符串
      - text: "// 说明"
      - text: 连续多行以 # 开头
    answer: [1]
    explain: "Python 没有专门的多行注释语法。文档字符串用三引号，写在模块、类、函数的第一行，可通过 __doc__ 访问；普通注释用 #。"
    tags: [注释]
    difficulty: 1

  - qid: py-01-010
    type: single
    stem: "在 Python 解释器里执行 `import this`，会发生什么？"
    options:
      - text: "打开 Python 官方文档网站"
      - text: "在控制台打印出《Python 之禅》（The Zen of Python）"
      - text: "启动一个内置的教程向导"
      - text: "报错，因为 this 不是标准模块"
    answer: [1]
    explain: "`import this` 会打印 The Zen of Python，由 Tim Peters 写就，共 19 条格言（如『Explicit is better than implicit』『Readability counts』）。它是 Python 的一个经典内置彩蛋。"
    tags: [设计哲学, 彩蛋]
    difficulty: 1

  - qid: py-01-011
    type: single
    stem: "直接运行 `python main.py`，Python 会把它编译成的字节码缓存到 `__pycache__` 目录吗？"
    options:
      - text: "会，和 import 的模块一样"
      - text: "不会，只有被 `import` 的模块才会缓存字节码"
      - text: "会，但文件名规则不同"
      - text: "只在首次运行时缓存"
    answer: [1]
    explain: "只有被 import 的模块才会生成并缓存 .pyc 到 __pycache__。直接运行的入口脚本只执行一次，缓存没有收益，所以不产生 .pyc。__pycache__ 通常加入 .gitignore 不提交。"
    tags: [运行机制, 易错]
    difficulty: 2

  - qid: py-01-012
    type: single
    stem: "Python 3 中表达式 `5 / 2` 和 `5 // 2` 的结果分别是？"
    options:
      - text: "2 和 2.5"
      - text: "2.5 和 2"
      - text: "2.5 和 2.5"
      - text: "2 和 2"
    answer: [1]
    explain: "Python 3 的 / 是真除法，永远返回 float（5/2 == 2.5，整除也是 float 如 4/2==2.0）；// 是地板除（5//2 == 2）。这点和 Java 不同：Java 的 5/2 截断为 2。"
    tags: [运算符, 易错]
    difficulty: 2

  - qid: py-01-013
    type: single
    stem: "在 Windows 上用官方推荐的 PyManager 安装 Python 3.14，正确的命令是？"
    options:
      - text: "py install 3.14"
      - text: "pip install python==3.14"
      - text: "python --install 3.14"
      - text: "winget python 3.14"
    answer: [0]
    explain: "Python 3.14 时代官方主推 PyManager 安装管理器，用 `py install 3.14` 安装指定版本（无 GIL 版用 `py install 3.14t`），`py --list` 列出已装版本。多版本管理很方便，类比 Java 世界的 SDKMAN。"
    tags: [环境]
    difficulty: 2

  - qid: py-01-014
    type: single
    stem: "想在当前目录快速起一个静态文件服务器供浏览器预览，应该用哪个命令？"
    options:
      - text: "python -m http.server 8000"
      - text: "python serve . 8000"
      - text: "python -c server(8000)"
      - text: "python start server 8000"
    answer: [0]
    explain: "`python -m` 以模块方式运行标准库工具，`python -m http.server 8000` 会在当前目录起一个 HTTP 静态服务器，访问 http://localhost:8000。类似的还有 -m pip、-m venv、-m json.tool、-m calendar。"
    tags: [环境, 命令]
    difficulty: 2

  - qid: py-01-015
    type: single
    stem: "文件被直接运行（`python mymod.py`）时，其内置变量 `__name__` 的值是？"
    options:
      - text: '"__main__"'
      - text: "模块名 mymod"
      - text: "None"
      - text: '"__name__"'
    answer: [0]
    explain: "每个 .py 都有内置变量 __name__。直接运行时为字符串 '__main__'，被 import 时则等于模块名。所以 `if __name__ == '__main__':` 用来区分『直接运行』和『被导入』两种角色，是 Python 的强约定。"
    tags: [入口, 易错]
    difficulty: 2

  - qid: py-01-016
    type: single
    stem: "在 Python 交互式解释器（REPL）里，下划线 `_` 的作用是？"
    options:
      - text: "保存上一个表达式的计算结果，便于接着算"
      - text: "表示当前模块名"
      - text: "表示注释的简写"
      - text: "只在 .py 文件里有效"
    answer: [0]
    explain: "REPL 中 `_` 自动保存上一条表达式的结果，`_ + 50` 可继续计算。注意这特性只在 REPL 里有，写在 .py 文件里没有效果（普通 `_` 常作『我不用这个变量』的占位名）。"
    tags: [REPL]
    difficulty: 2

  - qid: py-01-017
    type: code
    stem: "把一条信息输出到标准错误流（而不是默认的标准输出）。"
    template: |
      import sys
      print("出错了", {{blank}}=sys.stderr)
    blanks: ["file"]
    explain: "print 的 file 参数指定输出目标，默认是 sys.stdout。设为 sys.stderr 可把错误/日志输出到标准错误流，与正常输出分离（类比 Java 的 System.err.println）。"
    tags: [print]
    difficulty: 2

  - qid: py-01-018
    type: single
    stem: "Python 中没有被赋值给任何变量的三引号字符串（且不在模块/函数/类开头），它本质是？"
    options:
      - text: "一个真实的字符串对象，只是没人引用它"
      - text: "被编译器直接丢弃的注释，不产生任何对象"
      - text: "语法错误"
      - text: "等同于 # 注释"
    answer: [0]
    explain: "三引号并不是真正的块注释，而是一个真实的字符串字面量（执行时创建后被丢弃）。只有 # 注释在编译阶段就被丢弃不产生字节码。docstring 之所以特殊，是因为它被绑定到 __doc__ 属性。"
    tags: [注释, 易错]
    difficulty: 2

  - qid: py-01-019
    type: single
    stem: "下面这段代码会抛出什么错误？\n```python\nif score >= 60\n    print('及格')\n```"
    options:
      - text: "SyntaxError: expected ':'"
      - text: "IndentationError"
      - text: "TabError"
      - text: "NameError"
    answer: [0]
    explain: "凡是后面跟代码块的关键字（if/elif/else/for/while/def/class/with/try 等）行尾都要冒号。漏写冒号是 SyntaxError: expected ':'。缩进错误则是 IndentationError（其子类 TabError 是混用 Tab/空格）。"
    tags: [缩进, 易错]
    difficulty: 1

  - qid: py-01-020
    type: single
    stem: "Python 2.7 的正式停止维护（EOL）时间是？"
    options:
      - text: "2020 年 1 月 1 日"
      - text: "2010 年 1 月 1 日"
      - text: "2026 年 1 月 1 日"
      - text: "从未停止维护"
    answer: [0]
    explain: "Python 2.7 在 2020-01-01 正式 EOL。现在（2026）看到 `print 'x'`（语句）或 `except X, e:` 就是 Python 2 老代码，应换资料。当前只学 Python 3（本系列以 3.14 为准）。"
    tags: [版本]
    difficulty: 2

  - qid: py-01-021
    type: single
    stem: "关于『Python 慢』，哪种说法最准确？"
    options:
      - text: "指纯 Python 循环慢；Web/数据/AI 的瓶颈通常在 IO、数据库或 GPU，开发效率才是收益点"
      - text: "Python 任何场景都比 Java 慢 10 倍以上"
      - text: "Python 完全不能用于生产环境"
      - text: "只有 CPython 慢，PyPy 和 CPython 一样慢"
    answer: [0]
    explain: "『Python 慢』主要指纯 Python 循环慢（比 Java 慢约 10~100 倍，因为 CPython 无 JIT、逐条解释）。但实际工作里数值计算走 NumPy（C/Fortran）、Web 瓶颈在 IO/数据库、AI 瓶颈在 GPU，执行速度往往不是瓶颈。"
    tags: [性能]
    difficulty: 2
