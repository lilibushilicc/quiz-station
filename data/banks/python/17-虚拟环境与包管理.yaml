meta:
  id: py-17
  title: 虚拟环境与包管理
  source: 相关知识/Python/17-虚拟环境与包管理.md
  order: 17
questions:
  - qid: py-17-001
    type: code
    stem: "用标准库创建一个虚拟环境。"
    template: |
      python -m {{blank}} .venv
    blanks: [venv]
    explain: "venv 是 Python 3.3+ 自带的标准库方案，无需额外安装。创建后需要在项目里激活它再装包。"
    tags: [venv]
    difficulty: 1

  - qid: py-17-002
    type: single
    stem: "在 Windows 的 PowerShell 里激活 .venv，应该执行？"
    options:
      - text: "source .venv/bin/activate"
      - text: ".venv\\Scripts\\Activate.ps1"
      - text: "activate .venv"
      - text: "python .venv activate"
    answer: [1]
    explain: "Windows 用 Scripts 目录（PowerShell 用 Activate.ps1，CMD 用 activate.bat），Linux / macOS 用 bin/activate。遇到执行策略限制时用 Set-ExecutionPolicy 放开。"
    tags: [venv, 环境]
    difficulty: 2

  - qid: py-17-003
    type: multiple
    stem: "关于 requirements.txt，正确的是？"
    options:
      - text: "用 pip freeze > requirements.txt 导出当前环境的全部包"
      - text: 建议写明版本约束，避免不同机器装出不同结果
      - text: 它可以包含 -r other.txt 引用另一个文件
      - text: 它会锁定依赖的依赖，等价于完整的锁文件
    answer: [0, 1, 2]
    explain: "pip freeze 导出的是顶层加传递依赖的快照，但没有哈希校验，也不区分开发依赖。真正的锁文件要看 uv / poetry / pip-tools 生成的 lock 文件。"
    tags: [pip]
    difficulty: 3

  - qid: py-17-004
    type: single
    stem: "虚拟环境隔离依赖的核心机制是？"
    options:
      - text: 复制了一份独立的 Python 解释器
      - text: 修改了 sys.path 与可执行文件查找路径，让包装到环境自己的目录里
      - text: 用容器把进程隔离起来
      - text: 在系统目录之外重新编译了标准库
    answer: [1]
    explain: "venv 目录里有 pyvenv.cfg 指向基础解释器，site-packages 是独立的。激活本质上就是改 PATH。"
    tags: [venv, 原理]
    difficulty: 3

  - qid: py-17-005
    type: code
    stem: "从 requirements.txt 批量安装依赖。"
    template: |
      pip install {{blank}} requirements.txt
    blanks: ["-r"]
    explain: "常用组合：pip install -r requirements.txt、pip install -e .（可编辑安装当前项目）。"
    tags: [pip]
    difficulty: 1

  - qid: py-17-006
    type: multiple
    stem: "关于现代包管理工具，匹配正确的是？"
    options:
      - text: "uv：用 Rust 写的极快安装器与解析器，兼容 pip 命令"
      - text: "poetry：一体化管理依赖、打包与发布"
      - text: "conda：跨语言环境，常用在数据科学场景"
      - text: "pipenv：目前官方主推的唯一标准工具"
    answer: [0, 1, 2]
    explain: "官方标准仍是 pip + venv（PEP 668 之后推荐配合虚拟环境）。pipenv 已不再是主推方案，新项目更常见的是 uv 或 poetry。"
    tags: [工具链]
    difficulty: 3

  - qid: py-17-007
    type: single
    stem: "关于把虚拟环境提交到 Git，正确的是？"
    options:
      - text: 应该提交，方便队友直接复用
      - text: 不应提交，加入 .gitignore，只提交依赖清单让别人重建
      - text: 只提交 Scripts 目录即可
      - text: 提交压缩后的压缩包
    answer: [1]
    explain: "虚拟环境里有绝对路径和平台相关的可执行文件，换机器就失效，而且体积大。正确做法是提交 requirements.txt 或 lock 文件。"
    tags: [venv, 反模式]
    difficulty: 2

  - qid: py-17-008
    type: single
    stem: "系统装了多个 Python 版本时，推荐用什么方式调用 pip？"
    options:
      - text: "pip（裸命令）"
      - text: "python -m pip"
      - text: "pip3 only"
      - text: "sudo pip"
    answer: [1]
    explain: "python -m pip 保证把包装进「当前这个 python」对应的环境，避免多版本下裸 pip 指向不明。Windows 上也可用 py -m pip。"
    tags: [pip, 易错]
    difficulty: 2

  - qid: py-17-009
    type: single
    stem: "想安装「不低于 3.0 但低于 4.0」的 flask，正确的是？"
    options:
      - text: "pip install flask==3.0,<4.0"
      - text: "pip install \"flask>=3.0,<4.0\""
      - text: "pip install flask>=3.0<4.0"
      - text: "pip install flask~3.0"
    answer: [1]
    explain: "版本区间建议加引号，避免 shell 把 < 当成重定向。== 精确锁定、>= 不低于、< 上限。flask~=3.0 是兼容发布（~=3.0 等价于 >=3.0,<3.1）。"
    tags: [pip, 版本]
    difficulty: 2

  - qid: py-17-010
    type: code
    stem: "把当前已激活虚拟环境里装好的所有包（含精确版本）导出成清单文件。"
    template: |
      pip {{blank}} > requirements.txt
    blanks: ["freeze"]
    explain: "pip freeze 导出完整依赖树（含传递依赖）与精确版本。务必先激活环境再 freeze，否则导出全局包的无关项。复用时 pip install -r requirements.txt。"
    tags: [pip, requirements]
    difficulty: 1

  - qid: py-17-011
    type: multiple
    stem: "关于 pip 的常用子命令，匹配正确的是？"
    options:
      - text: "pip show requests：查看已装包的版本、依赖与安装位置"
      - text: "pip check：检查已装包之间的依赖冲突"
      - text: "pip download pkg -d ./wheels：只下载不安装（离线部署用）"
      - text: "pip list：列出所有已安装包"
    answer: [0, 1, 2, 3]
    explain: "这些都是 pip 的标准命令。pip list 列出已装包，pip show 看详情，pip check 查依赖冲突，pip download 离线下载。"
    tags: [pip]
    difficulty: 2

  - qid: py-17-012
    type: single
    stem: "国内访问 PyPI 慢，想临时用一个镜像源安装，正确的是？"
    options:
      - text: "pip install pkg -i https://pypi.tuna.tsinghua.edu.cn/simple"
      - text: "pip install pkg --pypi-speed"
      - text: "pip mirror set tsinghua"
      - text: "pip install pkg --china"
    answer: [0]
    explain: "用 -i/--index-url 指定镜像源地址；也可 pip config set global.index-url <url> 永久配置。注意只用可信镜像，避免包被投毒篡改。"
    tags: [pip, 镜像]
    difficulty: 2

  - qid: py-17-013
    type: single
    stem: "退出当前虚拟环境（回到系统 Python）应该执行？"
    options:
      - text: "exit"
      - text: "deactivate"
      - text: "pip deactivate"
      - text: "venv off"
    answer: [1]
    explain: "deactivate 只是停用环境、回到系统 Python，.venv 目录仍在，下次还能再 activate。删除则直接删目录（rm -rf .venv）。"
    tags: [venv]
    difficulty: 1

  - qid: py-17-014
    type: multiple
    stem: "关于 `python -m venv` 的创建选项，正确的是？"
    options:
      - text: "--system-site-packages：允许环境访问全局包（会削弱隔离，一般不推荐）"
      - text: "--prompt <text>：自定义激活后命令行提示符前缀"
      - text: "--without-pip：创建时不装 pip（极少用）"
      - text: "venv 需要先用 pip install virtualenv 才能用"
    answer: [0, 1, 2]
    explain: "venv 是标准库自带，无需 pip install virtualenv（那是第三方旧方案）。--system-site-packages 会访问全局包、削弱隔离；--without-pip 几乎不用。"
    tags: [venv]
    difficulty: 2

  - qid: py-17-015
    type: single
    stem: "裸 `pip freeze` + `requirements.txt` 的主要痛点之一是？"
    options:
      - text: "它无法导出传递依赖，复现不完整"
      - text: "它导出所有层依赖、不分直接/间接，且无真正的锁文件语义，易碎且平台相关"
      - text: "它要求必须联网才能生成"
      - text: "它只能用于 Windows"
    answer: [1]
    explain: "裸 requirements 把直接+间接依赖全写死、文件冗长易碎、不分直接/间接、无哈希锁文件语义。现代工具（pip-tools/poetry/uv）用 pyproject.toml 声明直接依赖 + .lock 固化完整解析。"
    tags: [pip, 局限]
    difficulty: 3

  - qid: py-17-016
    type: multiple
    stem: "关于 pip-tools，正确的是？"
    options:
      - text: "用 .in 文件写直接依赖，pip-compile 编译出带锁的 requirements.txt"
      - text: "pip-sync 严格按锁文件同步环境（会删除多余包）"
      - text: "它给裸 pip 补上了「锁文件」能力，侵入性最小"
      - text: "它取代了 venv，不再需要虚拟环境"
    answer: [0, 1, 2]
    explain: "pip-tools 是最小侵入方案：.in 写顶层依赖 → pip-compile 生成带精确版本的 requirements.txt（锁）→ pip-sync 严格同步。它仍工作在 venv 之上，不取代虚拟环境。"
    tags: [工具链, pip-tools]
    difficulty: 3

  - qid: py-17-017
    type: single
    stem: "Poetry 的核心文件组合是？"
    options:
      - text: "setup.py + requirements.txt"
      - text: "pyproject.toml + poetry.lock"
      - text: "Pipfile + Pipfile.lock"
      - text: "environment.yml"
    answer: [1]
    explain: "Poetry 用 pyproject.toml 声明依赖与项目元数据、poetry.lock 固化完整解析结果，一体化管理依赖/环境/打包发布，理念接近 Gradle。Pipfile 是 pipenv 的，environment.yml 是 conda 的。"
    tags: [工具链, poetry]
    difficulty: 2

  - qid: py-17-018
    type: code
    stem: "用 uv 管理项目，创建环境并添加依赖的标准命令是？"
    template: |
      uv {{blank}} .venv        # 创建虚拟环境
      uv {{blank}} requests     # 添加依赖（写进 pyproject.toml 并锁版本）
    blanks: ["venv", "add"]
    explain: "uv 一个工具取代 pip+venv+poetry：uv venv 建环境、uv add 加依赖（自动锁版本）、uv sync 按锁安装、uv run 运行命令，心智模型与 Maven/Gradle 一致。"
    tags: [工具链, uv]
    difficulty: 2

  - qid: py-17-019
    type: single
    stem: "Conda 与一般 Python 包管理器（pip/uv/poetry）最关键的区别是？"
    options:
      - text: "它只能管理 Python 包"
      - text: "它是跨语言的，能管理 Python 与非 Python 依赖（如 CUDA、R），常用于数据科学"
      - text: "它比 pip 慢很多且已淘汰"
      - text: "它不能创建独立环境"
    answer: [1]
    explain: "Conda 属另一条路线：跨语言环境管理器，可装 CUDA/R 等非 Python 依赖，常用于数据科学/机器学习。pip/uv/poetry 主要管 Python 包。"
    tags: [工具链, conda]
    difficulty: 2
