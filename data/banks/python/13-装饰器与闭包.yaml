meta:
  id: py-13
  title: 装饰器与闭包
  source: 相关知识/Python/13-装饰器与闭包.md
  order: 13
questions:
  - qid: py-13-001
    type: single
    stem: "构成闭包的条件是？"
    options:
      - text: 函数内部定义了另一个函数
      - text: 内层函数引用了外层作用域的变量，且外层函数返回了这个内层函数
      - text: 函数使用了全局变量
      - text: 函数用 lambda 写成
    answer: [1]
    explain: "闭包让外层变量在函数返回后依然存活，保存在函数的 __closure__ 里。它也是装饰器的实现基础。"
    tags: [闭包]
    difficulty: 2

  - qid: py-13-002
    type: code
    stem: "写一个最简单的计时装饰器，补全内层与返回语句。"
    template: |
      import time

      def timed(fn):
          def wrapper(*args, **kwargs):
              t0 = time.perf_counter()
              result = fn(*args, **kwargs)
              print(fn.__name__, time.perf_counter() - t0)
              return result
          return {{blank}}
    blanks: [wrapper]
    explain: "装饰器本质是「接收函数、返回函数」的高阶函数。@timed 等价于 func = timed(func)。"
    tags: [装饰器]
    difficulty: 2

  - qid: py-13-003
    type: single
    stem: "不加 functools.wraps 会有什么问题？"
    options:
      - text: 装饰器失效
      - text: 被装饰函数的 __name__、__doc__ 等元信息被 wrapper 覆盖
      - text: 运行报错
      - text: 性能下降
    answer: [1]
    explain: "@functools.wraps(fn) 会把名称、文档、注解、__wrapped__ 等复制过来，对调试、日志、文档生成和依赖该信息的框架都很重要。"
    tags: [装饰器, 易错]
    difficulty: 2

  - qid: py-13-004
    type: multiple
    stem: "关于带参数的装饰器（如 @retry(times=3)），正确的是？"
    options:
      - text: 需要三层嵌套：外层接收装饰器参数，中层接收函数，内层做包装
      - text: "@retry(times=3) 会先调用 retry(3) 得到真正的装饰器"
      - text: 也可以写成返回装饰器的类，不一定非要用函数嵌套
      - text: 带参数的装饰器最多只能两层嵌套
    answer: [0, 1, 2]
    explain: "三层结构是标准写法；可读性优先时，用实现了 __call__ 的类同样可行，也更容易携带状态。"
    tags: [装饰器]
    difficulty: 3

  - qid: py-13-005
    type: single
    stem: "两个装饰器叠加时的执行顺序是？"
    options:
      - text: "@A 在 @B 上面，则 A 先执行"
      - text: "装饰阶段自下而上（B 先包装），调用时自上而下（A 的 wrapper 先运行）"
      - text: 同时执行
      - text: 顺序随机
    answer: [1]
    explain: "@A / @B / def f 等价于 f = A(B(f))，所以 B 先包装 f，调用时先经过 A 的 wrapper。计时和重试叠加时这个顺序会影响统计口径。"
    tags: [装饰器, 易错]
    difficulty: 3

  - qid: py-13-006
    type: single
    stem: "闭包延迟绑定陷阱：`funcs = [lambda: i for i in range(3)]`，调用后结果是？"
    options:
      - text: "0, 1, 2"
      - text: "2, 2, 2"
      - text: "0, 0, 0"
      - text: 报错
    answer: [1]
    explain: "lambda 里的 i 是运行时才去外层作用域查的，循环结束后 i 已经是 2。解决方法是默认参数绑定：lambda i=i: i。"
    tags: [闭包, 易错]
    difficulty: 3

  - qid: py-13-007
    type: multiple
    stem: "以下哪些属于 Python 内置的装饰器或标准库装饰器？"
    options:
      - text: "@property"
      - text: "@staticmethod 和 @classmethod"
      - text: "@functools.lru_cache"
      - text: "@Override"
    answer: [0, 1, 2]
    explain: "Python 没有 @Override 装饰器（typing.override 是 3.12 加入的标注工具，不做运行时检查）。lru_cache 常用于记忆化递归和昂贵查询。"
    tags: [装饰器]
    difficulty: 2

  - qid: py-13-008
    type: single
    stem: "装饰器在什么时机执行？"
    options:
      - text: 每次调用被装饰函数时
      - text: 模块导入、函数定义完成的那一刻就执行了
      - text: 程序退出时
      - text: 第一次调用时
    answer: [1]
    explain: "@ 语法在定义时立即生效，所以注册路由、插件表这类副作用在 import 阶段就完成了，不需要显式调用注册函数。"
    tags: [装饰器, 易错]
    difficulty: 3
