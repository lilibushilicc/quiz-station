meta:
  id: py-12
  title: 迭代器与生成器
  source: 相关知识/Python/12-迭代器与生成器.md
  order: 12
questions:
  - qid: py-12-001
    type: single
    stem: "可迭代对象（iterable）与迭代器（iterator）的关系是？"
    options:
      - text: 两者是同一个概念
      - text: "可迭代对象实现 __iter__ 返回一个迭代器，迭代器还要实现 __next__"
      - text: "迭代器一定不是可迭代对象"
      - text: "列表是迭代器，不是可迭代对象"
    answer: [1]
    explain: "列表、字符串、字典是「可迭代对象」，能被 for 反复遍历；迭代器是一次性的，自身也实现 __iter__ 返回 self。用 iter(obj) 可以从前者拿到后者。"
    tags: [迭代器, 易错]
    difficulty: 3

  - qid: py-12-002
    type: code
    stem: "把函数改成生成器，逐个产出结果而不是一次性返回列表。"
    template: |
      def read_lines(path):
          for line in open(path):
              {{blank}} line.rstrip()
    blanks: [yield]
    explain: "含 yield 的函数调用后返回生成器对象，代码体在每次 next() 时执行到下一个 yield 就暂停，因此能节省内存并支持流式处理。"
    tags: [生成器]
    difficulty: 2

  - qid: py-12-003
    type: multiple
    stem: "使用生成器的好处有哪些？"
    options:
      - text: 惰性求值，不一次性占用大量内存
      - text: 可以表示无限序列
      - text: 能把读写逻辑流水线化，边生成边消费
      - text: 生成器可以重复遍历多次
    answer: [0, 1, 2]
    explain: "生成器是一次性的，遍历完再遍历没有结果。需要重复用时要么重新调用生成函数，要么先转成列表。"
    tags: [生成器, 易错]
    difficulty: 2

  - qid: py-12-004
    type: code
    stem: "用生成器表达式求 1 到 100 的平方和，不创建中间列表。"
    template: |
      total = {{blank}}(x * x for x in range(1, 101))
    blanks: [sum]
    explain: "生成器表达式用圆括号，sum、max、any、all 这类聚合函数可以直接消费，避免为中间结果分配内存。写成 [x*x for ...] 会先把列表建出来。"
    tags: [生成器]
    difficulty: 2

  - qid: py-12-005
    type: single
    stem: "生成器只能遍历一次，遍历第二次会得到什么？"
    options:
      - text: 从头重新开始
      - text: 什么都没有，立即 StopIteration
      - text: 抛出 RuntimeError
      - text: 返回 None
    answer: [1]
    explain: "生成器是有状态的游标，耗尽后就空了。想再遍历一次只能重新调用生成函数创建新生成器。"
    tags: [生成器, 易错]
    difficulty: 2

  - qid: py-12-006
    type: code
    stem: "在生成器里把产出工作委托给另一个可迭代对象。"
    template: |
      def flat(nested):
          for sub in nested:
              {{blank}} sub
    blanks: ["yield from"]
    explain: "yield from 会把子生成器逐个产出，还能自动透传 send() 的返回值和异常，比手写 for + yield 更简洁正确。"
    tags: [生成器]
    difficulty: 3

  - qid: py-12-007
    type: multiple
    stem: "关于 itertools 提供的工具，匹配正确的是？"
    options:
      - text: "chain 把多个可迭代对象首尾相接"
      - text: "groupby 对相邻的相同元素分组（通常需要先排序）"
      - text: "islice 对迭代器做切片，不占用额外内存"
      - text: "count 生成一个有限的整数序列"
    answer: [0, 1, 2]
    explain: "count 是无限计数器，从起始值一直递增下去。groupby 只对连续的同组元素生效，所以几乎总是配合 sorted 使用。"
    tags: [itertools]
    difficulty: 3

  - qid: py-12-008
    type: single
    stem: "调用 generator.send(value) 的作用是？"
    options:
      - text: 把 value 作为当前 yield 表达式的值，让生成器继续执行
      - text: 给生成器发送异常
      - text: 重新启动一个已经耗尽的生成器
      - text: 设置生成器的返回值
    answer: [0]
    explain: "send 之前必须先 next() 或 send(None) 让生成器停在 yield 处；throw() 用来在暂停点注入异常，close() 用来提前终止。"
    tags: [生成器]
    difficulty: 3

  - qid: py-12-009
    type: single
    stem: "执行 `it = iter([1, 2, 3]); print(list(it)); print(list(it))`，第二次 `list(it)` 的输出是？"
    options:
      - text: "[1, 2, 3]"
      - text: "[]"
      - text: "两次都报错"
      - text: "None"
    answer: [1]
    explain: "迭代器是一次性的游标，耗尽后再次遍历就是空的。map/filter/zip/enumerate 返回的都是迭代器，同样只能消费一次。"
    tags: [迭代器, 易错]
    difficulty: 2

  - qid: py-12-010
    type: single
    stem: "`next(it, '没了')` 在迭代器已经耗尽时返回什么？"
    options:
      - text: "抛 StopIteration"
      - text: "返回 '没了'（默认值）"
      - text: "返回 None"
      - text: "返回 0"
    answer: [1]
    explain: "next 的第二个参数提供默认值，耗尽时不再抛异常，直接返回它。等价于 try/except StopIteration 的简写。"
    tags: [迭代器]
    difficulty: 1

  - qid: py-12-011
    type: single
    stem: "`for x in obj:` 在底层等价于？"
    options:
      - text: "反复调用 obj[x] 取下标"
      - text: "调用 iter(obj) 取迭代器，然后循环 next() 直到捕获 StopIteration"
      - text: "直接调用 obj.__next__"
      - text: "用索引 0,1,2... 直到越界"
    answer: [1]
    explain: "for 自动调 iter 拿到迭代器，再不断 next，把 StopIteration 当作正常结束信号静默捕获，所以不需要写 try。"
    tags: [迭代器]
    difficulty: 2

  - qid: py-12-012
    type: single
    stem: "一个代表『数据集合』（可反复遍历）的类，`__iter__` 应该怎么写？"
    options:
      - text: "返回 self，这样最省事"
      - text: "返回一个全新的迭代器对象，让每次 for 都从干净状态开始"
      - text: "返回 None"
      - text: "返回 list(self)"
    answer: [1]
    explain: "返回 self 会让对象变成一次性，嵌套循环和重复遍历都会出问题（内层把状态吃光）。文件对象和生成器才返回 self。"
    tags: [迭代器, 易错]
    difficulty: 3

  - qid: py-12-013
    type: single
    stem: "调用一个包含 `yield` 的生成器函数 `g = gen()` 时，会怎样？"
    options:
      - text: "立即从头到尾执行函数体"
      - text: "只创建生成器对象，函数体不执行，直到第一次 next()"
      - text: "报错"
      - text: "返回 None"
    answer: [1]
    explain: "只要函数体里有 yield，它就不再是普通函数：调用只返回生成器对象，函数体在首个 next() 跑到第一个 yield 才真正开始执行。"
    tags: [生成器, 易错]
    difficulty: 2

  - qid: py-12-014
    type: single
    stem: "生成器里写 `return '结束'` 的作用是？"
    options:
      - text: "把 '结束' 作为最后一个被 yield 产出的值"
      - text: "提前结束迭代，'结束' 被包进 StopIteration.value，普通 for 拿不到"
      - text: "和 yield 一样把值交给调用方"
      - text: "语法错误"
    answer: [1]
    explain: "生成器的 return 是终止信号，返回值进入 StopIteration 异常对象，常见用途是在 yield from 中向上传递结果。"
    tags: [生成器]
    difficulty: 3

  - qid: py-12-015
    type: single
    stem: "执行 `threshold = 3; g = (x for x in range(10) if x > threshold); threshold = 8; print(list(g))`，输出是？"
    options:
      - text: "[4, 5, 6, 7, 8, 9]"
      - text: "[9]"
      - text: "[]"
      - text: "报错"
    answer: [1]
    explain: "生成器捕获的是变量而不是值，执行到判断时 threshold 已是 8。要固定当时的值就得立即 list() 固化或用默认参数捕获。"
    tags: [生成器, 易错]
    difficulty: 3

  - qid: py-12-016
    type: single
    stem: "生成器表达式和列表推导式相比，内存占用上？"
    options:
      - text: "两者差不多"
      - text: "生成器表达式内存恒定，与数据量几乎无关"
      - text: "列表推导式更省内存"
      - text: "生成器表达式始终更大"
    answer: [1]
    explain: "生成器只保存『如何计算下一个值』的信息，不持有数据本身；列表推导式会立刻物化出完整列表。"
    tags: [生成器]
    difficulty: 2

  - qid: py-12-017
    type: single
    stem: "数据量很小且要立刻全部用掉时，生成器一定更快吗？"
    options:
      - text: "一定更快"
      - text: "不一定，列表推导式反而更快，生成器的优势在内存和惰性而非原始速度"
      - text: "两者速度完全一样"
      - text: "取决于解释器版本"
    answer: [1]
    explain: "生成器每次 next() 都有函数调用和状态切换开销。小数据场景别为了『显得专业』硬上生成器。"
    tags: [生成器]
    difficulty: 2

  - qid: py-12-018
    type: single
    stem: "刚创建生成器 `g = accumulator()` 后直接调用 `g.send(10)`，会怎样？"
    options:
      - text: "正常工作并返回结果"
      - text: "TypeError: can't send non-None value to a just-started generator"
      - text: "返回 10"
      - text: "AttributeError"
    answer: [1]
    explain: "新建生成器停在函数开头、还没到任何 yield，此时 send 非 None 值会报错。必须先 next(g) 或 g.send(None) 预激。"
    tags: [生成器, 易错]
    difficulty: 3

  - qid: py-12-019
    type: single
    stem: "在生成器里捕获到 `GeneratorExit`（来自 close()）时，应该？"
    options:
      - text: "吞掉不处理，让函数正常返回"
      - text: "做完清理后重新 raise，否则会报 RuntimeError"
      - text: "返回 None 即可"
      - text: "忽略异常继续 yield"
    answer: [1]
    explain: "close() 会注入 GeneratorExit，生成器可以清理资源但必须让它继续向上传播，吞掉会触发 RuntimeError。"
    tags: [生成器, 易错]
    difficulty: 3

  - qid: py-12-020
    type: single
    stem: "关于 `yield from`，正确的是？"
    options:
      - text: "它只是 `for x in it: yield x` 的语法糖，没有额外能力"
      - text: "除了转发值，还会透传子生成器的 send()/throw() 并接收其 return 值"
      - text: "它会把子生成器的结果自动并行执行"
      - text: "只能用于列表"
    answer: [1]
    explain: "yield from 不是简单语法糖，它维护与子生成器的双向通道，是早期协程（asyncio 之前）的实现基础。"
    tags: [生成器]
    difficulty: 3

  - qid: py-12-021
    type: code
    stem: "补全自定义迭代器，实现从 n 倒数到 1。"
    template: |
      class Countdown:
          def __init__(self, n):
              self.n = n
          def __iter__(self):
              return self
          def {{blank}}(self):
              if self.n <= 0:
                  raise StopIteration
              self.n -= 1
              return self.n + 1
    blanks: ["__next__"]
    explain: "迭代器必须实现 __iter__（返回 self）和 __next__；__next__ 在没有更多元素时抛 StopIteration，for 会据此停下。"
    tags: [迭代器]
    difficulty: 2
