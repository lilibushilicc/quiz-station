meta:
  id: py-15
  title: 标准库常用模块
  source: 相关知识/Python/15-标准库常用模块.md
  order: 15
questions:
  - qid: py-15-001
    type: multiple
    stem: "collections 里提供的容器，用途匹配正确的是？"
    options:
      - text: "defaultdict：缺键时自动创建默认值"
      - text: "Counter：计数，支持 most_common"
      - text: "deque：双端队列，头尾增删都是 O(1)"
      - text: "namedtuple：可变的数据类，可以随意改字段"
    answer: [0, 1, 2]
    explain: "namedtuple 是不可变的（用 _replace 生成新实例）。需要可变且带默认值的数据类用 dataclasses.dataclass。"
    tags: [collections]
    difficulty: 2

  - qid: py-15-002
    type: multiple
    stem: "关于 datetime，正确的是？"
    options:
      - text: "datetime.now() 拿到的是不带时区的本地时间"
      - text: "带时区的时间用 datetime.now(timezone.utc) 或 astimezone"
      - text: "strftime 格式化输出，strptime 解析字符串"
      - text: "timedelta 只能表示正数，不能表示负的时间差"
    answer: [0, 1, 2]
    explain: "naive 时间和 aware 时间不能相互比较，混用会抛 TypeError。存储一律用 UTC，展示时再转本地时区。"
    tags: [datetime, 易错]
    difficulty: 3

  - qid: py-15-003
    type: single
    stem: "random 模块生成的是？"
    options:
      - text: 密码学安全的随机数
      - text: 伪随机数，基于确定算法和种子，不能用于生成密钥或令牌
      - text: 真随机数，来自硬件噪声
      - text: 每次运行都相同的固定序列
    answer: [1]
    explain: "安全场景用 secrets 模块（secrets.token_urlsafe、secrets.randbelow）。random.seed() 可复现序列，便于测试。"
    tags: [random, 安全]
    difficulty: 2

  - qid: py-15-004
    type: code
    stem: "给函数加缓存，重复调用同样的参数不再重新计算。"
    template: |
      from functools import lru_cache

      @lru_cache({{blank}}=None)
      def fib(n):
          return n if n < 2 else fib(n - 1) + fib(n - 2)
    blanks: [maxsize]
    explain: "maxsize=None 表示不限容量。被缓存的函数参数必须可哈希。清空缓存用 fib.cache_clear()。"
    tags: [functools]
    difficulty: 2

  - qid: py-15-005
    type: single
    stem: "处理文件路径时，pathlib 相比 os.path 的主要优势是？"
    options:
      - text: 速度更快
      - text: 面向对象，支持 / 拼接，跨平台差异被封装
      - text: 是唯一能处理绝对路径的方式
      - text: 支持网络路径
    answer: [1]
    explain: "Path 对象把路径当成对象而非字符串，提供 read_text、glob、exists、mkdir(parents=True) 等一整套方法，代码可读性好很多。"
    tags: [pathlib]
    difficulty: 2

  - qid: py-15-006
    type: code
    stem: "用 itertools 把多个可迭代对象首尾连起来。"
    template: |
      from itertools import chain

      for x in chain.{{blank}}(list_a, list_b):
          print(x)
    blanks: [from_iterable]
    explain: "chain(a, b) 直接接收多个可迭代对象，chain.from_iterable([a, b]) 接收一个装着可迭代对象的容器。"
    tags: [itertools]
    difficulty: 3

  - qid: py-15-007
    type: multiple
    stem: "关于 logging，推荐的做法有哪些？"
    options:
      - text: 用 logger = logging.getLogger(__name__) 按模块获取 logger
      - text: 在库代码里只记日志，不配置 handler；配置交给应用入口
      - text: 用 logging.exception 自动附带 traceback
      - text: 用 print 打日志，简单直接
    answer: [0, 1, 2]
    explain: "print 无法分级、无法关闭、没有时间戳。库里配置 basicConfig 会干扰使用方，是常见反模式。"
    tags: [logging]
    difficulty: 3

  - qid: py-15-008
    type: code
    stem: "用 argparse 声明一个必填的位置参数。"
    template: |
      import argparse

      parser = argparse.ArgumentParser()
      parser.add_argument({{blank}}, help="输入文件路径")
    blanks: ["'path'"]
    explain: "名字不带 - 前缀的是位置参数，带 -- 的是可选参数。required=True 可以把可选参数变成必填。"
    tags: [argparse]
    difficulty: 3
