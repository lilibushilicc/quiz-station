meta:
  id: py-07
  title: 函数详解
  source: 相关知识/Python/07-函数详解.md
  order: 7
questions:
  - qid: py-07-001
    type: single
    stem: "关于默认参数 `def f(x, items=[])`，多次调用不传 items 会发生什么？"
    options:
      - text: 每次调用都是一个全新的空列表
      - text: 默认列表在函数定义时创建一次，多次调用会共享并累积元素
      - text: 报错，默认参数不允许是可变对象
      - text: 第一次调用正常，之后抛异常
    answer: [1]
    explain: "默认参数在函数定义时求值一次，之后一直复用同一个对象。正确写法是 items=None，函数体内写 if items is None: items = []。"
    tags: [参数, 易错]
    difficulty: 3

  - qid: py-07-002
    type: code
    stem: "定义一个接收任意数量位置参数和关键字参数的函数。"
    template: |
      def f({{blank}}, {{blank}}):
          print(args, kwargs)
    blanks: ["*args", "**kwargs"]
    explain: "*args 把多余的位置参数收成元组，**kwargs 把多余的关键字参数收成字典。调用时也可以用 * 和 ** 把序列和字典展开传入。"
    tags: [参数]
    difficulty: 2

  - qid: py-07-003
    type: single
    stem: "Python 的参数传递机制最接近下面哪种描述？"
    options:
      - text: 值传递，函数拿到的是副本
      - text: 引用传递，形参与实参是同一个变量
      - text: 传对象的引用：重新绑定形参不影响实参，但原地修改可变对象会影响
      - text: 不可变类型值传递、可变类型引用传递
    answer: [2]
    explain: "实参和形参绑定到同一个对象。函数里写 x = x + 1 只是让形参指向新对象，外部不变；而 x.append(1) 是原地修改，外部能看到。"
    tags: [参数, 易错]
    difficulty: 3

  - qid: py-07-004
    type: multiple
    stem: "关于作用域，说法正确的是？"
    options:
      - text: 查找顺序是 Local → Enclosing → Global → Built-in
      - text: 函数内给全局变量重新赋值需要用 global 声明
      - text: 内层函数要修改外层函数的局部变量，需要用 nonlocal 声明
      - text: 函数内可以直接修改全局列表的元素，不需要 global
    answer: [0, 1, 2, 3]
    explain: "global / nonlocal 只影响「重新绑定名字」。原地修改对象（如 lst.append）不涉及绑定，所以不需要声明。"
    tags: [作用域, 易错]
    difficulty: 3

  - qid: py-07-005
    type: code
    stem: "在嵌套函数里给外层函数的计数器加一，需要先声明。"
    template: |
      def outer():
          count = 0
          def inner():
              {{blank}} count
              count += 1
          return inner
    blanks: [nonlocal]
    explain: "count += 1 是重新绑定名字，不声明会被当成 inner 的局部变量，从而报 UnboundLocalError。改全局变量用 global。"
    tags: [作用域, 易错]
    difficulty: 3

  - qid: py-07-006
    type: single
    stem: "关于 lambda，说法正确的是？"
    options:
      - text: lambda 可以写多行、包含语句和循环
      - text: lambda 只能写一个表达式，结果就是返回值
      - text: lambda 比 def 定义的函数运行更快
      - text: lambda 必须有名字
    answer: [1]
    explain: "lambda 只能包含一个表达式，不能写 return、if 语句块、循环等；它和 def 生成的是同一类函数对象，性能没有差别。"
    tags: [lambda]
    difficulty: 2

  - qid: py-07-007
    type: multiple
    stem: "关于 `def f(a, b, /, c, d, *, e, f)` 这样的签名，正确的是？"
    options:
      - text: a 和 b 是仅位置参数，不能写成 a=1
      - text: e 和 f 是仅关键字参数，必须写成 e=1
      - text: c 和 d 既可以按位置也可以按关键字传
      - text: 斜杠和星号只是装饰，没有任何作用
    answer: [0, 1, 2]
    explain: "/ 之前的参数只能按位置传，* 之后的只能按关键字传，两者之间的都行。这个语法用来保证将来重命名参数不会破坏调用方。"
    tags: [参数]
    difficulty: 3

  - qid: py-07-008
    type: single
    stem: "函数里写 `return 1, 2`，调用方用一个变量接收，拿到的是？"
    options:
      - text: "1"
      - text: "一个元组 (1, 2)"
      - text: "一个列表 [1, 2]"
      - text: 报错
    answer: [1]
    explain: "多个返回值会被打包成元组，真正返回的是一个元组对象。通常写成 a, b = f() 直接解包。"
    tags: [返回值]
    difficulty: 2

  - qid: py-07-009
    type: code
    stem: "把列表中每个元素转成字符串长度，用 map 配合 lambda。"
    template: |
      result = list({{blank}}(lambda s: len(s), names))
    blanks: [map]
    explain: "map 和 filter 返回迭代器，需要 list() 展开。这类简单场景用列表推导式 [len(s) for s in names] 可读性更好。"
    tags: [函数式]
    difficulty: 2

  - qid: py-07-010
    type: single
    stem: "关于递归，说法错误的是？"
    options:
      - text: 必须有终止条件，否则会栈溢出
      - text: "Python 默认递归深度约 1000 层，超过会抛 RecursionError"
      - text: 递归一定比等价的循环更快
      - text: 可以用 functools.lru_cache 缓存中间结果优化
    answer: [2]
    explain: "函数调用有额外开销，递归通常比循环慢，还可能受递归深度限制。用 sys.setrecursionlimit 调高上限有栈溢出风险，一般建议改成迭代。"
    tags: [递归]
    difficulty: 2

  - qid: py-07-011
    type: single
    stem: "在定义函数时，带默认值的参数必须排在不带默认值的参数之后，否则会怎样？"
    options:
      - text: "自动给前面的参数也补上默认值"
      - text: "报 SyntaxError: non-default argument follows default argument"
      - text: "正常运行，只是默认值被忽略"
      - text: "报 TypeError"
    answer: [1]
    explain: "位置参数里，有默认值的必须放在无默认值的后面（例如 `def f(b, a=1)`），否则解释器直接报 SyntaxError。"
    tags: [参数, 易错]
    difficulty: 2

  - qid: py-07-012
    type: single
    stem: "调用 `create_user(name='张三', 28, '北京')`（混用关键字与位置参数）会怎样？"
    options:
      - text: "正常运行，按位置补齐剩余参数"
      - text: "报 SyntaxError：关键字参数后面不能再跟位置参数"
      - text: "等价于 create_user('张三', 28, '北京')"
      - text: "报 TypeError"
    answer: [1]
    explain: "混用时关键字参数必须写在位置参数之后。`f(a=1, 2)` 这种写法在语法上就不合法。"
    tags: [参数, 易错]
    difficulty: 2

  - qid: py-07-013
    type: code
    stem: "补全：用 *args 让函数接受任意多个位置参数并返回它们的和（函数体内用 numbers 这个名字）。"
    template: |
      def sum_all({{blank}}):
          return sum(numbers)
    blanks: ["*numbers"]
    explain: "*args 把多余的位置实参收集成一个元组，所以函数体内拿到的是元组 numbers。调用时 f(1,2,3) 即可。"
    tags: [参数]
    difficulty: 2

  - qid: py-07-014
    type: single
    stem: "定义 `def f(a, b, c): ...` 且 `args = [1, 2, 3]`，调用 `f(*args)` 的效果等价于？"
    options:
      - text: "把列表 [1,2,3] 作为一个整体传给 f"
      - text: "把列表拆开成位置参数，等价于 f(1, 2, 3)"
      - text: "把列表作为关键字参数传入"
      - text: "报错，* 只能用于定义不能用于调用"
    answer: [1]
    explain: "定义函数时的 * 是『收集』，调用时的 * 是『展开（拆包）』，方向相反。两者还能一起用：f(*lst, **dic)。"
    tags: [参数]
    difficulty: 2

  - qid: py-07-015
    type: single
    stem: "调用 `f(**{'nickname': '张三'})` 来调用 `def f(name): ...`，结果怎样？"
    options:
      - text: "正常，nickname 自动对应到 name 参数"
      - text: "报 TypeError: f() got an unexpected keyword argument 'nickname'"
      - text: "报 TypeError: keywords must be strings"
      - text: "静默忽略 nickname，name 用默认值"
    answer: [1]
    explain: "** 解包要求字典的键必须是字符串且严格匹配参数名。键不匹配参数名会报 unexpected keyword argument；键不是字符串才报 keywords must be strings。"
    tags: [参数, 易错]
    difficulty: 3

  - qid: py-07-016
    type: single
    stem: "对于 `def divide(a, b, /): return a / b`，下列哪种调用能通过？"
    options:
      - text: "divide(a=10, b=2)"
      - text: "divide(10, b=2)"
      - text: "divide(10, 2)"
      - text: "divide(a=10, 2)"
    answer: [2]
    explain: "/ 之前的参数只能按位置传，不能写参数名。只有 divide(10, 2) 合法，其余都用了关键字名会报 TypeError。"
    tags: [参数, 易错]
    difficulty: 3

  - qid: py-07-017
    type: single
    stem: "执行 `funcs = []; for i in range(3): funcs.append(lambda: i)`，随后 `[f() for f in funcs]` 的结果是？"
    options:
      - text: "[0, 1, 2]"
      - text: "[2, 2, 2]"
      - text: "[<lambda>, <lambda>, <lambda>]"
      - text: "报错 TypeError"
    answer: [1]
    explain: "lambda 捕获的是变量 i 本身而非当时的取值。循环结束后 i 等于 2，三个 lambda 都读到 2。用 lambda i=i: i 在定义时冻结当前值即可修正。"
    tags: [lambda, 易错]
    difficulty: 3

  - qid: py-07-018
    type: code
    stem: "补全：在循环中创建 lambda，用默认参数把当前的 i 冻结住，使每个函数记住各自的 i。"
    template: |
      funcs.append(lambda {{blank}}: i)
    blanks: ["i=i"]
    explain: "默认参数在定义那一刻求值并锁定，因此每个 lambda 捕获到的是各自循环轮次的 i 值，而不是共享的变量。"
    tags: [lambda, 易错]
    difficulty: 3

  - qid: py-07-019
    type: single
    stem: "要在函数内修改模块级的全局变量 `counter`，正确做法是？"
    options:
      - text: "直接写 counter += 1，无需任何声明"
      - text: "用 `global counter` 声明后，再修改"
      - text: "用 `nonlocal counter` 声明后修改"
      - text: "Python 无法修改全局变量"
    answer: [1]
    explain: "函数内只要对名字赋值，该名字就被当作局部变量。要改全局必须先 global 声明。nonlocal 只针对外层函数（非全局）作用域。"
    tags: [作用域, 易错]
    difficulty: 2

  - qid: py-07-020
    type: single
    stem: "执行 `counter = 0`，再定义 `def f(): counter = counter + 1` 并调用 `f()`，会怎样？"
    options:
      - text: "输出 1"
      - text: "报 UnboundLocalError"
      - text: "报 NameError"
      - text: "输出 0"
    answer: [1]
    explain: "编译函数时发现 counter 在函数体内被赋值，于是整函数内它都是局部变量。等号右侧读取它时尚未绑定，于是报 UnboundLocalError。只读不写则没问题。"
    tags: [作用域, 易错]
    difficulty: 3

  - qid: py-07-021
    type: single
    stem: "先执行 `list = [1, 2, 3]`，之后再调用 `list('abc')`，会怎样？"
    options:
      - text: "返回 ['a', 'b', 'c']"
      - text: "报 TypeError: 'list' object is not callable"
      - text: "正常，list 仍是内置函数"
      - text: "报 NameError"
    answer: [1]
    explain: "用 list、dict、str、type 等内置名做变量名会覆盖内置对象，之后当函数调用就报 TypeError。习惯上用 list_、type_ 等加下划线避免。"
    tags: [作用域, 易错]
    difficulty: 2

  - qid: py-07-022
    type: single
    stem: "函数 `def add(a: int, b: int) -> int: return a + b`，调用 `add('你', '好')` 会怎样？"
    options:
      - text: "报 TypeError，因为注解要求 int"
      - text: "正常运行并返回 '你好'"
      - text: "报 ValueError"
      - text: "编译期直接拒绝"
    answer: [1]
    explain: "类型注解只是元数据，运行时 Python 解释器完全不校验类型。注解的价值在于 IDE 提示和 mypy/pyright 等静态检查工具。"
    tags: [注解, 易错]
    difficulty: 2

  - qid: py-07-023
    type: single
    stem: "先后定义 `def greet(name): ...` 和 `def greet(name, greeting): ...`，再调用 `greet('张三')` 会怎样？"
    options:
      - text: "自动匹配第一个签名并返回"
      - text: "报 TypeError: greet() missing 1 required positional argument"
      - text: "两个函数共存，都能用"
      - text: "正常返回，后定义覆盖前定义但旧签名仍可用"
    answer: [1]
    explain: "Python 没有方法重载，同名函数后定义的覆盖前面的。greet('张三') 实际调用的是两参数的版本，少传一个参数就 TypeError。"
    tags: [函数, 易错]
    difficulty: 2

  - qid: py-07-024
    type: single
    stem: "`squared = map(lambda x: x ** 2, [1, 2, 3]); print(squared)` 会输出什么？"
    options:
      - text: "[1, 4, 9]"
      - text: "<map object at 0x...> 这样的迭代器，尚未计算"
      - text: "(1, 4, 9)"
      - text: "报错"
    answer: [1]
    explain: "map 和 filter 返回惰性迭代器，只有用 list() 展开时才真正计算。这也是它们常和 list() 一起用的原因。"
    tags: [函数式]
    difficulty: 2

  - qid: py-07-025
    type: single
    stem: "在 Python 3 中直接使用 `reduce(lambda a, b: a + b, [1, 2, 3])`（未导入），会怎样？"
    options:
      - text: "返回 6"
      - text: "报 NameError: name 'reduce' is not defined"
      - text: "报 TypeError"
      - text: "返回 [1, 2, 3]"
    answer: [1]
    explain: "reduce 在 Python 3 被移到了 functools，必须 `from functools import reduce`。简单求和直接用 sum() 即可，无需 reduce。"
    tags: [函数式, 易错]
    difficulty: 2

  - qid: py-07-026
    type: single
    stem: "`list(filter(None, [1, 0, 'hello', '', None, [1], []]))` 的结果是？"
    options:
      - text: "[1, 0, 'hello', '', None, [1], []]"
      - text: "[1, 'hello', [1]]"
      - text: "[0, '', None, []]"
      - text: "[]"
    answer: [1]
    explain: "filter(None, ...) 等价于保留所有真值，过滤掉 0、空字符串、None、空列表等假值。需要 list() 才能看到结果。"
    tags: [函数式]
    difficulty: 2

  - qid: py-07-027
    type: single
    stem: "`double = make_multiplier(2)` 之后（make_multiplier 返回捕获了 factor 的函数），`double.__closure__[0].cell_contents` 等于？"
    options:
      - text: "0"
      - text: "2"
      - text: "None"
      - text: "报错，函数没有 __closure__ 属性"
    answer: [1]
    explain: "闭包 = 函数 + 它捕获的外层变量环境。即使 make_multiplier 已返回，内部函数仍持有对 factor 的引用，可通过 __closure__ 查看。"
    tags: [闭包]
    difficulty: 3
